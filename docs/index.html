<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Killer Party</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0a0b'/%3E%3Cpolygon points='16,3.5 22,14.5 16,28.5 10,14.5' fill='%23f3ebe6'/%3E%3Cpolygon points='16,8.5 19.2,14.5 16,22 12.8,14.5' fill='%23c42b3a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0c0a0b; --elev:#141011; --surf:#1a1516; --surf2:#221c1d; --fg:#f3ebe6; --muted:#9a8c86; --subtle:#6e635f; --accent:#c42b3a; --border:#2c2426; --warn:#c4a574; --display:"Fraunces",ui-serif,Georgia,serif; --sans:"Outfit",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --safe-t:max(1.25rem,env(safe-area-inset-top)); --safe-b:max(1rem,env(safe-area-inset-bottom)); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); min-height: 100dvh; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; } button:disabled { opacity: .45; }
    h1,h2 { font-family: var(--display); font-weight: 500; margin: 0; }
    p { margin: 0; }
    #app { min-height: 100dvh; max-width: 430px; margin: 0 auto; }
    .wrap { min-height: 100dvh; display: flex; flex-direction: column; padding: var(--safe-t) 1.25rem var(--safe-b); }
    .kicker { font-family: var(--mono); font-size: .6875rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
    .mark { width: 14px; height: 14px; }
    .title { font-size: 4.4rem; line-height: .9; margin-top: 2.4rem; }
    .rule { width: 4rem; height: 1px; background: var(--accent); margin: 1.5rem 0 0; }
    .lede { margin-top: 1.5rem; max-width: 20rem; color: var(--muted); line-height: 1.55; }
    .stack { margin-top: auto; display: flex; flex-direction: column; gap: .75rem; padding-top: 2.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 3.25rem; border-radius: 12px; border: 0; padding: 0 1rem; font-weight: 500; }
    .btn-lg { width: 100%; } .btn-fill { background: var(--fg); color: var(--bg); }
    .btn-out { background: transparent; box-shadow: 0 0 0 1px rgba(243,235,230,.12); }
    .btn-ghost { background: transparent; color: var(--muted); } .btn-accent { background: var(--accent); }
    .btn-sm { height: 2.5rem; flex: 1; font-size: .85rem; }
    .link { background: none; border: 0; color: var(--muted); height: 2.75rem; }
    .field { display: flex; flex-direction: column; gap: .4rem; } label { color: var(--muted); font-size: .9rem; }
    input, textarea { background: var(--surf); border: 0; border-radius: 12px; padding: .9rem 1rem; box-shadow: 0 0 0 1px rgba(243,235,230,.08); outline: none; width: 100%; }
    textarea { min-height: 6rem; }
    .back { background: none; border: 0; color: var(--muted); align-self: flex-start; padding: 0; }
    .toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 4.5rem); transform: translateX(-50%); background: var(--elev); padding: .7rem 1rem; border-radius: 10px; font-size: .85rem; z-index: 40; }
    .card { background: var(--surf); border-radius: 16px; padding: 1.1rem 1.25rem; box-shadow: 0 0 0 1px rgba(243,235,230,.08); }
    .secret { user-select: none; -webkit-user-select: none; min-height: 6.5rem; }
    .secret .hold { color: var(--subtle); font-size: .8rem; }
    .secret .bar { height: 12px; background: var(--surf2); border-radius: 4px; margin-top: .55rem; width: 70%; }
    .list { background: var(--surf); border-radius: 16px; box-shadow: 0 0 0 1px rgba(243,235,230,.08); overflow: hidden; }
    .row { display: flex; justify-content: space-between; padding: .85rem 1rem; border-top: 1px solid var(--border); }
    .row:first-child { border-top: 0; } .out { color: var(--subtle); text-decoration: line-through; }
    .chip { font-family: var(--mono); font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .tabs { display: flex; background: var(--surf); border-radius: 10px; padding: 4px; }
    .tabs button { flex: 1; height: 2.5rem; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
    .tabs button.on { background: var(--elev); color: var(--fg); }
    .seats { border-top: 1px solid var(--border); background: var(--elev); padding: .75rem .75rem var(--safe-b); }
    .seats .scroller { display: flex; gap: .5rem; overflow-x: auto; }
    .seat { height: 2.5rem; padding: 0 .9rem; border-radius: 999px; border: 0; background: var(--surf); color: var(--muted); white-space: nowrap; }
    .seat.on { background: var(--fg); color: var(--bg); }
    .warnbox { background: var(--surf); border-radius: 12px; padding: .9rem 1rem; color: var(--muted); font-size: .9rem; }
    .choice { width: 100%; text-align: left; height: 3rem; border: 0; border-radius: 10px; padding: 0 .85rem; background: var(--surf2); color: var(--muted); }
    .choice.on { background: var(--elev); color: var(--fg); }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; }
    .rule-item { display: flex; gap: 1rem; margin-top: 1.75rem; }
    .ico { width: 2.25rem; height: 2.25rem; border-radius: 8px; background: var(--surf); display: grid; place-items: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .stagger > * { animation: rise .4s ease both; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
