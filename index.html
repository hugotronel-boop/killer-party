<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Killer Party</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0c0a0b; --elev:#141011; --surf:#1a1516; --surf2:#221c1d; --fg:#f3ebe6; --muted:#9a8c86; --subtle:#6e635f; --accent:#c42b3a; --border:#2c2426; --warn:#c4a574; --display:"Fraunces",ui-serif,Georgia,serif; --sans:"Outfit",ui-sans-serif,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --safe-t:max(1.25rem,env(safe-area-inset-top)); --safe-b:max(1rem,env(safe-area-inset-bottom)); --shadow:0 0 0 1px rgba(243,235,230,.08); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); min-height: 100dvh; }
    button, input, textarea, a.btn { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; } button:disabled { opacity: .4; }
    h1,h2 { font-family: var(--display); font-weight: 500; margin: 0; } p { margin: 0; }
    #app { min-height: 100dvh; max-width: 430px; margin: 0 auto; }
    .wrap { min-height: 100dvh; display: flex; flex-direction: column; padding: var(--safe-t) 1.5rem var(--safe-b); }
    .wrap.page { padding-bottom: 4rem; } .wrap.play { padding-bottom:.5rem; min-height:0; flex:1; }
    .screen { min-height: 100dvh; display: flex; flex-direction: column; }
    .kicker { font-family: var(--mono); font-size: .6875rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
    .mark { width: 16px; height: 16px; } .wordmark { display: flex; align-items: center; gap: .5rem; }
    .wordmark .mark { width: 20px; height: 20px; }
    .wordmark span { font-family: var(--display); font-size: .875rem; letter-spacing: .22em; text-transform: uppercase; }
    .title { font-size: 4.4rem; line-height: .9; margin-top: 2.5rem; }
    .page-title { font-size: 2.25rem; margin-top: 2.5rem; } .page-title.tight { margin-top: .5rem; }
    .rule { width: 4rem; height: 1px; background: var(--accent); margin: 1.5rem 0 0; }
    .lede { margin-top: .75rem; max-width: 22rem; color: var(--muted); line-height: 1.55; font-size: .95rem; }
    .stack { margin-top: auto; display: flex; flex-direction: column; gap: .75rem; padding-top: 2.5rem; }
    .col { display: flex; flex-direction: column; gap: 1.4rem; flex: 1; margin-top: 1.5rem; }
    .play-body { gap: 1.1rem; margin-top: 1rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 3.5rem; border-radius: 12px; padding: 0 1.25rem; font-weight: 500; text-decoration: none; }
    .btn-lg { width: 100%; } .btn-fill { background: var(--fg); color: var(--bg); }
    .btn-out { background: transparent; box-shadow: var(--shadow); }
    .btn-ghost { background: transparent; color: var(--muted); } .btn-accent { background: var(--accent); color: var(--fg); }
    .btn-sm { height: 2.5rem; flex: 1; font-size: .875rem; }
    .link { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; color: var(--muted); height: 2.75rem; font-size: .9rem; }
    .ico-svg { width: 16px; height: 16px; flex-shrink: 0; }
    .field { display: flex; flex-direction: column; gap: .4rem; } label { color: var(--muted); font-size: .9rem; }
    input, textarea { background: var(--surf); border: 0; border-radius: 12px; padding: .9rem 1rem; box-shadow: var(--shadow); outline: none; width: 100%; }
    textarea { min-height: 6rem; } .back { color: var(--muted); align-self: flex-start; padding: 0; font-size: .9rem; }
    .form { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; } .form.tight { margin-top: 0; gap: .7rem; }
    .toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 4.5rem); transform: translateX(-50%); background: var(--elev); padding: .7rem 1rem; border-radius: 10px; font-size: .85rem; z-index: 40; box-shadow: var(--shadow); max-width: 90vw; }
    .card { background: var(--surf); border-radius: 16px; padding: 1.1rem 1.25rem; box-shadow: var(--shadow); border: 0; width: 100%; text-align: left; color: inherit; }
    .secret { min-height: 9rem; display: flex; flex-direction: column; }
    .secret-title { font-family: var(--display); font-size: 2.25rem; margin-top: .75rem; line-height: 1; }
    .secret-body { margin-top: .75rem; line-height: 1.5; color: var(--muted); }
    .bars { margin-top: 1.5rem; display: flex; flex-direction: column; gap: .5rem; width: 75%; }
    .bar { height: 10px; background: var(--surf2); border-radius: 4px; } .bar.short { width: 66%; }
    .hold { margin-top: auto; display: inline-flex; align-items: center; gap: .45rem; color: var(--muted); font-size: .875rem; align-self: center; padding-top: .75rem; }
    .list { background: var(--surf); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); list-style: none; padding: 0; margin: 0; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: .85rem 1rem; border-top: 1px solid var(--border); gap: .75rem; }
    .row:first-child { border-top: 0; } .row-name { display: flex; align-items: center; gap: .75rem; }
    .out { color: var(--subtle); text-decoration: line-through; }
    .chip { font-family: var(--mono); font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .chip.count { margin-top: 2.5rem; } .chip.warn { color: var(--warn); }
    .tabs { display: flex; background: var(--surf); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
    .tabs button { flex: 1; height: 2.5rem; border-radius: 8px; color: var(--muted); font-weight: 500; }
    .tabs button.on { background: var(--elev); color: var(--fg); }
    .seats { border-top: 1px solid var(--border); background: var(--elev); padding: .75rem .75rem var(--safe-b); }
    .seats .chip { margin: 0 0 .5rem .25rem; } .seats .scroller { display: flex; gap: .5rem; overflow-x: auto; }
    .seat { height: 2.5rem; padding: 0 .9rem; border-radius: 999px; background: var(--surf); color: var(--muted); white-space: nowrap; }
    .seat.on { background: var(--fg); color: var(--bg); }
    .warnbox { display: flex; gap: .75rem; background: var(--surf); border-radius: 12px; padding: .9rem 1rem; box-shadow: var(--shadow); font-size: .9rem; color: var(--muted); }
    .choice { width: 100%; text-align: left; height: 3rem; border-radius: 10px; padding: 0 .85rem; background: var(--surf2); color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
    .choice.on { background: var(--elev); color: var(--fg); } .choices { display: flex; flex-direction: column; gap: .45rem; margin-top: .7rem; }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; }
    .center-text { text-align: center; color: var(--muted); }
    .rule-item { display: flex; gap: 1rem; margin-top: 2rem; }
    .ico { width: 2.25rem; height: 2.25rem; border-radius: 8px; background: var(--surf); display: grid; place-items: center; flex-shrink: 0; box-shadow: var(--shadow); color: var(--muted); }
    .topbar { display: flex; justify-content: space-between; align-items: center; }
    .code-card { display: flex; justify-content: space-between; align-items: center; }
    .code-big { font-family: var(--display); font-size: 2.4rem; margin-top: .25rem; letter-spacing: .08em; }
    .add-row { display: flex; gap: .5rem; } .icon-only { width: 3.5rem; padding: 0; flex-shrink: 0; }
    .icon-btn { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; color: var(--muted); border-radius: 8px; flex-shrink: 0; }
    .missions { list-style: none; padding: 0; margin: .5rem 0 0; }
    .mission { display: flex; align-items: flex-start; gap: .25rem; border-bottom: 1px solid var(--border); padding: 1rem 0; }
    .mission-text { flex: 1; padding-top: .5rem; font-size: .9rem; line-height: 1.5; }
    .row-actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .muted { color: var(--muted); } .muted.small { font-size: .9rem; margin-top: .5rem; line-height: 1.5; }
    .tiny { font-size: .75rem; margin-top: .25rem; }
    .whisper { text-align: center; color: var(--subtle); font-size: .75rem; }
    .accent { color: var(--accent); } .subtle { color: var(--subtle); }
    .claim { background: var(--elev); border-radius: 10px; padding: .85rem; margin-top: .7rem; }
    .claim-exp { margin-top: .4rem; font-size: .9rem; }
    .big-ico .ico-svg { width: 2.5rem; height: 2.5rem; color: var(--muted); }
    .hero-name { font-size: 3rem; } .grand { font-family: var(--display); font-size: 1.3rem; color: var(--muted); }
    .center .mark { width: 3rem; height: 3rem; color: var(--accent); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .stagger > * { animation: rise .4s ease both; }
  </style>
</head>
<body>
  <div id="app">
    <div class="wrap">
      <p class="kicker">Soirée privée</p>
      <h1 class="title">Killer<br/>Party</h1>
      <div class="rule"></div>
      <p class="lede">Chargement du jeu…</p>
    </div>
  </div>
  <script src="./app.js"></script>
  <script src="./views-home.js"></script>
  <script src="./views-play.js"></script>
  <script src="./bind.js"></script>
</body>
</html>
